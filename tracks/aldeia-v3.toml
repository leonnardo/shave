name = "Aldeia da Serra (ADSv3 no AiM)"
# Measured, not official: median of 58 complete laps, 2026-10-11.
# Close to the 1021 m published for the "Traçado Oficial" (motorlap.com/tracks/1098),
# but that this is the same layout is unconfirmed.
expected_length_m = 1016
length_tolerance_m = 20

# Median of the logger's beacon crossings on 2026-10-11 (62 crossings, spread < 1 m).
[finish_line]
lat_deg = -23.508334
lon_deg = -46.931803
heading_deg = 166.4

# Segments from the hand analysis of 2026-10-11 (its stations were measured on
# its own reference lap; every corner here contains the apex found on this
# layout's reference line, except C4, a flat-out kink too mild to detect).
# C5 and C8-9 start 7 and 3 m earlier than in the analysis, where braking starts
# (median GPS deceleration on the reference session; see move_out_of_braking).
# R0 runs from the finish line to the first corner; corners include their braking zone. C8 and C9 are one segment, as in the analysis.
# RO = reta oposta, RP = reta principal.
[[segment]]
id = "R0"
start_m = 0
